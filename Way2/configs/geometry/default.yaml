# Mathematical state-estimator (feasible-region) parameters.
region_bound_m: 5000.0          # initial big square half-side for half-plane clipping
clip_to_arena: true             # intersect regions with the 1800 m arena disc

# A source counts as "localized" (clearable) once the minimum enclosing circle of
# its feasible region has radius <= this. It must stay strictly below the 20 m
# clear radius so that clearing at the circle centre is guaranteed to succeed.
localize_mec_radius_m: 18.0

# Coarse coverage grid (used by search heuristics now, and the CNN encoder later).
grid_resolution_m: 60.0
