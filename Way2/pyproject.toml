[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "radio_rl"
version = "0.1.0"
description = "Modular DRL system for radio interference source localization (CUMCM 2026 Problem B, Way 2)"
requires-python = ">=3.10"
dependencies = [
    "numpy>=1.24",
    "scipy>=1.10",
    "torch>=2.0",
    "omegaconf>=2.3",
    "pyyaml>=6.0",
    "gymnasium>=0.29",
    "tqdm>=4.65",
    "requests>=2.28",
]

[project.optional-dependencies]
# Heavy / platform-specific plugins. The core (env + math + PPO + MLP) never
# imports these; they are pulled in lazily only when the matching config is used.
gnn = ["torch-geometric>=2.4"]
mamba = ["mamba-ssm>=1.2"]
wandb = ["wandb>=0.16"]
dev = ["pytest>=7.4", "matplotlib>=3.7"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
